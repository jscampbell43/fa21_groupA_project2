spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:sqlite:WishlistDatabase.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Disable Spring Security auto-configuration - using manual authentication with Spring Security password encoding
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# SpringDoc OpenAPI / Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.show-actuator=false

# Custom API Info
springdoc.api-docs.info.title=Wishlist API
springdoc.api-docs.info.description=REST API for Wishlist Application - User authentication and item management
springdoc.api-docs.info.version=1.0.0
springdoc.api-docs.info.contact.name=Wishlist Team
springdoc.api-docs.info.contact.email=support@wishlist.com

